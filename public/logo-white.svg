<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- The Loop (Triquetra / Topological Trefoil) -->
  <path d="M 50,25 
           A 43.3,43.3 0 0,1 71.65,62.5 
           A 43.3,43.3 0 0,1 28.35,62.5 
           A 43.3,43.3 0 0,1 50,25 
           M 50,25 
           A 43.3,43.3 0 0,0 28.35,62.5 
           A 43.3,43.3 0 0,0 71.65,62.5 
           A 43.3,43.3 0 0,0 50,25" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>
  
  <!-- Interlinked central topological ring -->
  <circle cx="50" cy="50" r="14.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- Three Nodes representing AI, Biotech, Evidence -->
  <circle cx="50" cy="25" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="71.65" cy="62.5" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="28.35" cy="62.5" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
</svg>