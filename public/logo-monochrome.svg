<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Face 1: The 'T' Stem & Left Uplink -->
    <path d="M 50,12 L 20,64 L 32,71 L 50,40 L 68,71 L 80,64 Z" 
          fill="none" stroke="#888888" stroke-width="8.5"/>
    
    <!-- Face 2: The 'F' Junction middle crossover -->
    <path d="M 32,71 L 68,71 L 59,55 L 50,40" 
          fill="none" stroke="#888888" stroke-width="8.5"/>

    <!-- Face 3: The 'L' Lower Curve base -->
    <path d="M 20,64 L 80,64 L 68,71" 
          fill="none" stroke="#888888" stroke-width="8.5"/>

    <!-- Face 4: The hidden 'F' middle horizontal tick -->
    <path d="M 59,55 L 72,55" 
          fill="none" stroke="#888888" stroke-width="8.5"/>

    <!-- Single prominent orbital node (representing Primary Evidence) -->
    <circle cx="50" cy="12" r="5" fill="#ffffff" stroke="#888888" stroke-width="2.5"/>
  </g>
</svg>