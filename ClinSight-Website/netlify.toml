[build]
  publish = "."
  command = ""
  ignore = "exit 0" # Staging on Cloudflare: pause Netlify builds to preserve monthly credits

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
